<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investment Portfolio Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-10 px-4">

  <div class="max-w-2xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Investment Tracker Portal</h1>
      <p class="text-slate-500 mt-1">Log your monthly valuations and cash inflows directly to Google Sheets</p>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex justify-center bg-slate-200 p-1 rounded-xl mb-6 shadow-inner">
      <button onclick="switchTab('valuation')" id="btn-valuation" class="flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white text-blue-600 shadow-sm transition-all">Monthly Valuation Check-In</button>
      <button onclick="switchTab('cashflow')" id="btn-cashflow" class="flex-1 py-2.5 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition-all">Log Cash Inflow / Deposit</button>
    </div>

    <!-- Hidden Iframe to prevent redirect and handle POST submission silently -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="handleResponse()"></iframe>

    <!-- Form 1: Valuation Check-In -->
    <div id="section-valuation" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
      <h2 class="text-xl font-semibold text-slate-900 mb-4">Monthly Valuation Check-In</h2>
      <form id="valForm" action="https://script.google.com/macros/s/AKfycbwNaYqBrciSPe8cslMlDWGmVcKKXTp4p6CquKzIF7g3yZE-uRtnZyFc77rtFhZ0QwL68Q/exec" method="POST" target="hidden_iframe" class="space-y-5">
        <input type="hidden" name="type" value="valuation">
        
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Check Date</label>
          <input type="date" name="date" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-slate-50">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Asset / Platform</label>
          <select name="asset" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-slate-50">
            <option value="Wahed Invest">Wahed Invest</option>
            <option value="Bitcoin (BTC)">Bitcoin (BTC)</option>
            <option value="Trading 212">Trading 212</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Current Market Value (£)</label>
          <input type="number" step="0.01" name="currentValue" placeholder="e.g. 6100.00" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-slate-50">
        </div>

        <button type="submit" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition-all">
          Submit Valuation Check-In
        </button>
      </form>
    </div>

    <!-- Form 2: Cash Flow Inflow -->
    <div id="section-cashflow" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 hidden">
      <h2 class="text-xl font-semibold text-slate-900 mb-4">Log Capital Inflow / Deposit</h2>
      <form id="cashForm" action="https://script.google.com/macros/s/AKfycbwNaYqBrciSPe8cslMlDWGmVcKKXTp4p6CquKzIF7g3yZE-uRtnZyFc77rtFhZ0QwL68Q/exec" method="POST" target="hidden_iframe" class="space-y-5">
        <input type="hidden" name="type" value="cash_flow">
        
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Deposit Date</label>
          <input type="date" name="date" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-slate-50">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Asset / Platform</label>
          <select name="asset" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-slate-50">
            <option value="Wahed Invest">Wahed Invest</option>
            <option value="Bitcoin (BTC)">Bitcoin (BTC)</option>
            <option value="Trading 212">Trading 212</option>
          </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Category</label>
            <select name="category" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-slate-50">
              <option value="ETFs / Stocks">ETFs / Stocks</option>
              <option value="Crypto">Crypto</option>
              <option value="Shares">Shares</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Transaction Type</label>
            <select name="flowType" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-slate-50">
              <option value="Addition">Addition</option>
              <option value="Initial">Initial</option>
              <option value="Withdrawal">Withdrawal</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Amount (£)</label>
          <input type="number" step="0.01" name="amount" placeholder="e.g. 500.00" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-slate-50">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Notes (Optional)</label>
          <input type="text" name="notes" placeholder="e.g. Monthly top-up" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-slate-50">
        </div>

        <button type="submit" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition-all">
          Log Cash Flow Deposit
        </button>
      </form>
    </div>

    <!-- Success Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-emerald-600 text-white px-6 py-3 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 font-medium">
      Successfully logged to your Google Sheet! 🎉
    </div>
  </div>

  <script>
    let submittalActive = false;

    function switchTab(tab) {
      if (tab === 'valuation') {
        document.getElementById('section-valuation').classList.remove('hidden');
        document.getElementById('section-cashflow').classList.add('hidden');
        document.getElementById('btn-valuation').className = 'flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white text-blue-600 shadow-sm transition-all';
        document.getElementById('btn-cashflow').className = 'flex-1 py-2.5 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition-all';
      } else {
        document.getElementById('section-cashflow').classList.remove('hidden');
        document.getElementById('section-valuation').classList.add('hidden');
        document.getElementById('btn-cashflow').className = 'flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white text-blue-600 shadow-sm transition-all';
        document.getElementById('btn-valuation').className = 'flex-1 py-2.5 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition-all';
      }
    }

    document.getElementById('valForm').onsubmit = () => { submittalActive = true; };
    document.getElementById('cashForm').onsubmit = () => { submittalActive = true; };

    function handleResponse() {
      if (submittalActive) {
        submittalActive = false;
        document.querySelectorAll('form').forEach(f => f.reset());
        
        // Show success toast
        const toast = document.getElementById('toast');
        toast.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => {
          toast.classList.add('translate-y-20', 'opacity-0');
        }, 3500);
      }
    }
  </script>
</body>
</html>
